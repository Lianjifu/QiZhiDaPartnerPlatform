name: backend-contract

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/packages/api/**"
      - "frontend/packages/types/**"
      - ".github/workflows/backend-contract.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract.yml"
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Go test
        env:
          # Isolate unit tests from any accidental local FastAPI RAG.
          QZDA_RAG_URL: http://127.0.0.1:1
        run: go test ./... -count=1
      - name: Proto presence (Connect IDL, single-process monolith)
        run: |
          test -f api/proto/qzda/collab/v1/collab.proto
          test -f api/proto/qzda/rag/v1/rag.proto
          test -f api/proto/qzda/runtime/v1/runtime.proto
          test -f api/proto/qzda/partner/v1/partner.proto
          test -f buf.yaml
          test -f buf.gen.yaml
          test -f gen/qzda/rag/v1/rag.pb.go
          test -f gen/qzda/collab/v1/collab.pb.go
          test -f gen/qzda/rag/v1/ragv1connect/rag.connect.go
          # Docker 栈关键文件存在
          test -f deploy/compose.yml
          test -f deploy/.env.example
          test -f deploy/migrations/0001_init.sql || test -f deploy/migrations/0001_initial.sql
          test -f deploy/qzda-sandbox/seccomp.json
          test -f Dockerfile
          test -f cmd/qzda-app/Dockerfile
          test -f services/qzda-sandbox/Dockerfile
          test -f services/qzda-rag/Dockerfile
          test -f services/qzda-gateway/Dockerfile
          # Dockerfile 必须以单进程命令结尾(monolith 形态)
          grep -q 'CMD=qzda-app' Dockerfile
          grep -q 'qzda-sandbox' services/qzda-sandbox/Dockerfile
          test -f services/qzda-sandbox/Dockerfile
          test -f services/qzda-gateway/Dockerfile
          test -f services/qzda-rag/requirements-milvus.txt
          test -f cmd/qzda-app/main.go
          test -f cmd/qzda-app/Dockerfile
          test ! -f cmd/qzda-sys/main.go
          test ! -f cmd/qzda-collab/main.go
          test ! -f cmd/qzda-cap/main.go
          test ! -f cmd/qzda-workflow/main.go
          test ! -f deploy/envoy/envoy.split.yaml
          test ! -d go
          test ! -d python
      - name: Error code surface
        run: |
          grep -q 'E_WORKSPACE_SCOPE' pkg/errors/errors.go
          grep -q 'E_SOD_SELF_APPROVAL' pkg/errors/errors.go
          grep -q 'E_EGRESS_BLOCKED' pkg/errors/errors.go
          grep -q 'E_DIGITAL_EMPLOYEE_PROFILE_INCOMPLETE' pkg/errors/errors.go
          grep -q 'E_DIGITAL_EMPLOYEE_CONFIGURATION_REQUIRED' pkg/errors/errors.go
      - name: RAG vector smoke
        run: python3 services/qzda-rag/tests/test_vector.py
      - name: Skill RunToken smoke
        run: python3 services/qzda-sandbox/tests/test_runtoken.py

  contract-routes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Critical FE routes documented
        run: |
          test -f api/routes.md
          grep -q '/api/copilot/conversations' api/routes.md || grep -q 'copilot' api/routes.md
          grep -q 'contract-gap' api/contract-gap.md

  # Full monolith smoke needs compose (Postgres/Redis/gateway). Manual / scheduled only.
  smoke-monolith:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Start monolith stack
        run: make compose-up-monolith
      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8089/healthz >/dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 5
          done
          echo "gateway not ready"
          exit 1
      - name: Smoke
        run: make smoke-monolith
      - name: Tear down
        if: always()
        run: make compose-down || true
