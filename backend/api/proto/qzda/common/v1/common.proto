syntax = "proto3";

// Agent OS 共用枚举与消息。线格式（SSE / JSON）使用注释中的短名，禁止再造同义字符串。
package qzda.common.v1;

option go_package = "github.com/qizhida-partner-platform/backend/gen/qzda/common/v1;commonv1";

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_INVESTIGATE = 1; // wire: investigate
  SESSION_MODE_EXECUTE = 2; // wire: execute
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1; // wire: low
  RISK_LEVEL_MEDIUM = 2; // wire: medium
  RISK_LEVEL_HIGH = 3; // wire: high
}

enum PolicyDecision {
  POLICY_DECISION_UNSPECIFIED = 0;
  POLICY_DECISION_ALLOW = 1; // wire: allow
  POLICY_DECISION_MASK = 2; // wire: mask
  POLICY_DECISION_APPROVAL_REQUIRED = 3; // wire: approval_required
  POLICY_DECISION_DENY = 4; // wire: deny
}

// 入站 Caller 种类（Envelope.channel），不是投递目录 ChannelKind 全集。
enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_WEB = 1; // wire: web
  CHANNEL_KIND_API = 2; // wire: api
  CHANNEL_KIND_FEISHU = 3; // wire: feishu
  CHANNEL_KIND_WECOM = 4; // wire: wecom
  CHANNEL_KIND_DINGTALK = 5; // wire: dingtalk
  CHANNEL_KIND_EMAIL = 6; // reserved; not inbound or delivery
}

enum StreamEventType {
  STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  STREAM_EVENT_TYPE_STAGE = 1; // wire: stage
  STREAM_EVENT_TYPE_DELTA = 2; // wire: delta
  STREAM_EVENT_TYPE_TOOL = 3; // wire: tool
  STREAM_EVENT_TYPE_ROUTE = 4; // wire: route
  STREAM_EVENT_TYPE_EVIDENCE = 5; // wire: evidence
  STREAM_EVENT_TYPE_DONE = 6; // wire: done
  STREAM_EVENT_TYPE_ERROR = 7; // wire: error
  STREAM_EVENT_TYPE_MESSAGE_START = 8; // wire: message_start
  STREAM_EVENT_TYPE_MESSAGE_DELTA = 9; // wire: message_delta
  STREAM_EVENT_TYPE_MESSAGE_DONE = 10; // wire: message_done
}

enum LoopMode {
  LOOP_MODE_UNSPECIFIED = 0;
  LOOP_MODE_DIRECT = 1; // wire: direct
  LOOP_MODE_REACT = 2; // wire: react
  LOOP_MODE_PLAN_EXEC = 3; // wire: plan_exec
  LOOP_MODE_MULTI_AGENT = 4; // wire: multi_agent
}

enum MemoryLayer {
  MEMORY_LAYER_UNSPECIFIED = 0;
  MEMORY_LAYER_SHORT_TERM = 1; // wire: short_term
  MEMORY_LAYER_WORKING = 2; // wire: working
  MEMORY_LAYER_LONG_TERM = 3; // wire: long_term
}

message Envelope {
  string tenant_id = 1;
  string workspace_id = 2;
  string actor_id = 3;
  ChannelKind channel = 4;
  string channel_thread_id = 5;
  string session_id = 6;
  string partner_id = 7;
  string correlation_id = 8;
  string classification = 9;
  SessionMode session_mode = 10;
  RiskLevel risk_level = 11;
}

message MemoryProvenance {
  string id = 1;
  string title = 2;
  MemoryLayer layer = 3;
  double score = 4;
}

message ContextSnapshot {
  string id = 1;
  string correlation_id = 2;
  string system = 3;
  int32 history_turns = 4;
  repeated MemoryProvenance memory_provenance = 5;
  int32 rag_hits = 6;
  repeated string tool_registry = 7;
  string built_at = 8;
  string partner_id = 9;
  SessionMode session_mode = 10;
}
