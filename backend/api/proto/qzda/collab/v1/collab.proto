syntax = "proto3";

package qzda.collab.v1;

import "qzda/common/v1/common.proto";

option go_package = "github.com/qizhida-partner-platform/backend/gen/qzda/collab/v1;collabv1";

// Collaboration / Copilot control-plane service (Connect-RPC).
service CollabService {
  // CreateConversation 创建控制面会话。
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  // StreamTurn 推送与 SSE 同词表的回合事件（阶段 1 接到同一内核）。
  rpc StreamTurn(StreamTurnRequest) returns (stream StreamTurnEvent);
  // ReplayTurn 按 correlation_id 只读复盘；禁止再调模型或工具。
  rpc ReplayTurn(ReplayTurnRequest) returns (ReplayTurnResponse);
}

message CreateConversationRequest {
  string workspace_id = 1;
  string title = 2;
  string digital_partner_id = 3;
}

message Conversation {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  string digital_partner_id = 4;
  string updated_at = 5;
}

message StreamTurnRequest {
  string conversation_id = 1;
  string workspace_id = 2;
  string content = 3;
  string correlation_id = 4;
  string digital_partner_id = 5;
  // envelope 由网关/入站适配器填充；客户端字段不得覆盖租户与身份。
  qzda.common.v1.Envelope envelope = 6;
  qzda.common.v1.SessionMode session_mode = 7;
  qzda.common.v1.RiskLevel risk_level = 8;
  string client_msg_id = 9;
  repeated string enabled_tools = 10;
  string model_id = 11;
  string mode_hint = 12;
}

message StreamTurnEvent {
  // type 保留字符串以兼容现网 SSE；新调用方应同时填 event_type。
  string type = 1; // stage|delta|tool|route|evidence|done|error
  string stage = 2; // policy|employee|rag|runtime|meter
  string text = 3;
  string correlation_id = 4;
  map<string, string> meta = 5;
  string snapshot_id = 6;
  int32 rag_hits = 7;
  int32 memory_hits = 8;
  qzda.common.v1.PolicyDecision policy_decision = 9;
  qzda.common.v1.StreamEventType event_type = 10;
  qzda.common.v1.ContextSnapshot snapshot = 11;
}

message ReplayTurnRequest {
  string conversation_id = 1;
  string correlation_id = 2;
  string workspace_id = 3;
}

message ReplayTurnResponse {
  qzda.common.v1.ContextSnapshot snapshot = 1;
  repeated StreamTurnEvent events = 2;
  string correlation_id = 3;
}
