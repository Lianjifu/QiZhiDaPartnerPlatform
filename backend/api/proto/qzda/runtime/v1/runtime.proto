syntax = "proto3";

package qzda.runtime.v1;

import "qzda/common/v1/common.proto";

option go_package = "github.com/qizhida-partner-platform/backend/gen/qzda/runtime/v1;runtimev1";

// RuntimeService 是 Agent Loop 的对内 ABI。Invoke 为兼容占位；新路径使用 Run。
service RuntimeService {
  // Invoke 返回一次性补全，仅用于联调占位。
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // Run 消费 ContextSnapshot 并流式输出 LoopEvent；阶段 2 由 qzda-agent-runtime 实现。
  rpc Run(RunRequest) returns (stream LoopEvent);
}

message InvokeRequest {
  string input = 1;
  string workspace_id = 2;
  string correlation_id = 3;
  string model_route_id = 4;
}

message InvokeResponse {
  string output = 1;
  string graph = 2;
  string correlation_id = 3;
  int32 tokens = 4;
}

message RunRequest {
  qzda.common.v1.Envelope envelope = 1;
  qzda.common.v1.ContextSnapshot snapshot = 2;
  string input = 3;
  qzda.common.v1.LoopMode loop_mode = 4;
  string model_id = 5;
  repeated string enabled_tools = 6;
  int32 max_steps = 7;
}

message LoopEvent {
  qzda.common.v1.StreamEventType type = 1;
  string stage = 2;
  string text = 3;
  string correlation_id = 4;
  map<string, string> meta = 5;
  string snapshot_id = 6;
  int32 rag_hits = 7;
  int32 memory_hits = 8;
  qzda.common.v1.PolicyDecision policy_decision = 9;
}
