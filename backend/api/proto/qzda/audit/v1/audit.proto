syntax = "proto3";

package qzda.audit.v1;

option go_package = "github.com/qizhida-partner-platform/backend/gen/qzda/audit/v1;auditv1";

service AuditService {
  rpc ListAuditCenter(ListAuditCenterRequest) returns (ListAuditCenterResponse);
  rpc ExportAudit(ExportAuditRequest) returns (ExportAuditResponse);
}

message ListAuditCenterRequest {
  string workspace_id = 1;
}

message AuditEvent {
  string id = 1;
  string workspace_id = 2;
  string time = 3;
  string actor = 4;
  string action = 5;
  string target = 6;
  string result = 7;
  string correlation_id = 8;
}

message ListAuditCenterResponse { repeated AuditEvent items = 1; }

message ExportAuditRequest { string workspace_id = 1; }

message ExportAuditResponse {
  string id = 1;
  string status = 2;
  string filename = 3;
  int32 record_count = 4;
  bool masked = 5;
}
