# 本地 / 单机 Docker Compose：单进程 Docker 部署方案。
#
# 启动顺序：postgres + redis 就绪 → qzda-sandbox / qzda-rag 就绪 → qzda-app 就绪
#           → qzda-gateway 就绪 → 全部 healthy。
#
# 端口：
#   5432  postgres (de/de, db=digital_employee)
#   6379  redis
#   8092  qzda-rag     (RAG vector backend)
#   8093  qzda-sandbox (skill 沙箱运行时,gVisor seccomp unconfined)
#   8100  qzda-app     (Go 单进程控制面)
#   8089  qzda-gateway (Python 反向代理,8089 → 8100)

services:
  postgres:
    # 优先用 pgvector/pgvector:pg16-alpine(自带 vector 扩展,开箱即用)。
    # 当前 Docker Hub 在内网不可达,沿用 postgres:16-alpine + 手动 bootstrap:
    #   bash scripts/dev-stack/pgvector-bootstrap.sh
    # 装入 vector.so + vector.control + vector--0.7.4.sql 到 PG 扩展目录。
    # pgvector 0.7.4 已实测在该容器中跑通(dense_embed 64-dim + cosine top-K),
    # 部署 / 迁移脚本详见 deploy/README.md §7.5。
    image: postgres:16-alpine
    container_name: qzda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: digital_employee
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - qzda_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d digital_employee"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qzda_net

  redis:
    image: redis:7-alpine
    container_name: qzda-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qzda_net

  qzda-sandbox:
    build:
      context: /Users/LIANJIFU/ops/QiZhiDaPartnerPlatform
      dockerfile: backend/services/qzda-sandbox/Dockerfile
    image: qzda-sandbox:local
    container_name: qzda-sandbox
    restart: unless-stopped
    # gVisor 集成:
    # - 默认 runtime=runc(兼容性兜底)
    # - 设 QZDA_SANDBOX_RUNTIME=runsc 启用 runsc:host 必须先装 runsc
    #   (curl -fsSL https://gvisor.dev/archive/nightly/latest/runsc
    #     -o /usr/local/bin/runsc && chmod +x /usr/local/bin/runsc)
    # - gVisor 自己实现 syscall 拦截,seccomp 必须 unconfined
    # - QZDA_SANDBOX_RUNTIME=runsc-kvm 需 host 启用 KVM(Linux only)
    runtime: ${QZDA_SANDBOX_RUNTIME:-runc}
    environment:
      QZDA_BIND_HOST: "0.0.0.0"
      QZDA_BIND_PORT: "8093"
      QZDA_SANDBOX_RUN_SECRET_FILE: /etc/qzda/skill-run-secret
      QZDA_SANDBOX_SANDBOX: ${QZDA_SANDBOX_SANDBOX:-runsc}
      QZDA_SANDBOX_REQUIRE_ISOLATION: "1"
      QZDA_SANDBOX_RUNTIME: ${QZDA_SANDBOX_RUNTIME:-runc}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom-multiproc
      QZDA_SANDBOX_AUDIT: ${QZDA_SANDBOX_AUDIT:-1}
      QZDA_SANDBOX_RATE_LIMIT_PER_MIN: ${QZDA_SANDBOX_RATE_LIMIT_PER_MIN:-60}
      QZDA_SANDBOX_TRUSTED_KEY_IDS: ${QZDA_SANDBOX_TRUSTED_KEY_IDS:-ed25519:dev-placeholder}
    secrets:
      - skill_run_secret
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /tmp/prom-multiproc:size=8m
      - /var/run:size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1024M, pids: 128 }
        reservations: { cpus: '0.25', memory: 128M }
    networks:
      - qzda_net

  qzda-rag:
    build:
      context: /Users/LIANJIFU/ops/QiZhiDaPartnerPlatform
      dockerfile: backend/services/qzda-rag/Dockerfile
    image: qzda-rag:local
    container_name: qzda-rag
    restart: unless-stopped
    environment:
      QZDA_BIND_HOST: "0.0.0.0"
      QZDA_BIND_PORT: "8092"
      # pgvector 与控制面共享同一 PG,容器内用服务名 hostname
      QZDA_PGVECTOR_URL: ${QZDA_PGVECTOR_URL:-postgres://de:de@postgres:5432/digital_employee?sslmode=disable}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom-multiproc
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

  qzda-app:
    build:
      context: /Users/LIANJIFU/ops/QiZhiDaPartnerPlatform
      dockerfile: backend/cmd/qzda-app/Dockerfile
      args: { CMD: qzda-app }
    image: qzda-app:local
    container_name: qzda-app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qzda-sandbox: { condition: service_healthy }
      qzda-rag: { condition: service_healthy }
    environment:
      QZDA_APP_ADDR: ":8100"
      QZDA_SERVICE: app
      QZDA_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      QZDA_REDIS_URL: redis://redis:6379/0
      QZDA_RUNTIME_MODE: local
      QZDA_SANDBOX_RUNTIME_URL: http://qzda-sandbox:8093
      QZDA_RAG_URL: http://qzda-rag:8092
      QZDA_SANDBOX_RUN_SECRET: ${QZDA_SANDBOX_RUN_SECRET:-qzda-skill-run-dev}
      QZDA_MODE: ${QZDA_MODE:-dev}
      QZDA_DATA_BACKEND: ${QZDA_DATA_BACKEND:-pg}
      QZDA_JWT_SECRET: ${QZDA_JWT_SECRET:-}
      QZDA_PUBLIC_BASE_URL: ${QZDA_PUBLIC_BASE_URL:-http://127.0.0.1:8089}
      QZDA_LLM_BASE_URL: ${QZDA_LLM_BASE_URL:-}
      QZDA_LLM_API_KEY: ${QZDA_LLM_API_KEY:-}
      QZDA_LLM_MODEL: ${QZDA_LLM_MODEL:-}
      QZDA_MODEL_CANDIDATE_TIMEOUT: ${QZDA_MODEL_CANDIDATE_TIMEOUT:-45}
      QZDA_COPILOT_STREAM_TIMEOUT: ${QZDA_COPILOT_STREAM_TIMEOUT:-300}
      QZDA_MODEL_ALLOW_PRIVATE: ${QZDA_MODEL_ALLOW_PRIVATE:-0}
      QZDA_OIDC_ISSUER: ${QZDA_OIDC_ISSUER:-}
      QZDA_OIDC_CLIENT_ID: ${QZDA_OIDC_CLIENT_ID:-}
      QZDA_OIDC_CLIENT_SECRET: ${QZDA_OIDC_CLIENT_SECRET:-}
      QZDA_OIDC_REDIRECT_URL: ${QZDA_OIDC_REDIRECT_URL:-http://127.0.0.1:8010/login/oidc/callback}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

  qzda-gateway:
    build:
      context: /Users/LIANJIFU/ops/QiZhiDaPartnerPlatform
      dockerfile: backend/services/qzda-gateway/Dockerfile
    image: qzda-gateway:local
    container_name: qzda-gateway
    restart: unless-stopped
    depends_on:
      qzda-app: { condition: service_healthy }
    environment:
      QZDA_BIND_HOST: "0.0.0.0"
      QZDA_BIND_PORT: "8089"
      QZDA_BACKEND_PORT: "8100"
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

volumes:
  qzda_pg:
  qzda_redis:

secrets:
  skill_run_secret:
    file: ./secrets/skill-run-secret

networks:
  qzda_net:
    driver: bridge
