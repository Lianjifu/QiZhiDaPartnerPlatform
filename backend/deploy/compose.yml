# M1 infrastructure: PostgreSQL + Redis (+ optional Envoy / Vault)
# Usage: from backend/ → make compose-up
name: qizhida-partner

services:
  postgres:
    image: postgres:16-alpine
    container_name: qzda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: digital_employee
      TZ: UTC
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    ports:
      - "5432:5432"
    volumes:
      - qzda_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d digital_employee"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - qzda_net

  # Optional streaming replica for DE_REPLICA_MODE=standby (not cn-east/south dual-active).
  postgres-replica:
    image: postgres:16-alpine
    container_name: qzda-postgres-replica
    restart: unless-stopped
    profiles: ["replica"]
    user: postgres
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: digital_employee
      PGPASSWORD: de
      TZ: UTC
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        until pg_isready -h postgres -U de -d digital_employee; do sleep 1; done
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h postgres -U de -D /var/lib/postgresql/data -Fp -Xs -P -R
        echo "hot_standby = on" >> /var/lib/postgresql/data/postgresql.auto.conf
        exec postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d digital_employee && psql -U de -d digital_employee -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - qzda_net

  redis:
    image: redis:7-alpine
    container_name: qzda-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - qzda_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - qzda_net

  vault:
    image: hashicorp/vault:1.17
    container_name: qzda-vault
    restart: unless-stopped
    profiles: ["full"]
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: qzda-vault-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - qzda_net

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: qzda-envoy
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8088:8088"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qzda_net

  # mTLS edge (dev CA). Generate certs: make certs
  envoy-mtls:
    image: envoyproxy/envoy:v1.31-latest
    container_name: qzda-envoy-mtls
    restart: unless-stopped
    profiles: ["mtls"]
    ports:
      - "8443:8443"
      - "9902:9901"
    volumes:
      - ./envoy/envoy.mtls.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qzda_net

  # SPIFFE URI SAN validation (make certs / certs-rotate). https://127.0.0.1:8444
  envoy-spiffe:
    image: envoyproxy/envoy:v1.31-latest
    container_name: qzda-envoy-spiffe
    restart: unless-stopped
    profiles: ["spiffe"]
    ports:
      - "8444:8444"
      - "9903:9901"
    volumes:
      - ./envoy/envoy.spiffe.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qzda_net


  # Optional Temporal (M4). qzda-workflow HTTP+Worker.
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: qzda-temporal
    restart: unless-stopped
    profiles: ["temporal"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: de
      POSTGRES_PWD: de
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - qzda_net

  # Local OIDC IdP (Dex). OIDC: DE_OIDC_ISSUER=http://127.0.0.1:5556/dex
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: qzda-dex
    restart: unless-stopped
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - qzda_net

  # Kafka-compatible audit bus (Redpanda). DE_KAFKA_BROKERS=127.0.0.1:9092
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: qzda-redpanda
    restart: unless-stopped
    profiles: ["kafka"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "19092:19092"
    networks:
      - qzda_net

  # Milvus standalone (etcd + minio + milvus). RAG: DE_MILVUS_URI=http://127.0.0.1:19530
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: qzda-milvus-etcd
    restart: unless-stopped
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - qzda_milvus_etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      qzda_net:
        aliases: ["milvus-etcd"]

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: qzda-milvus-minio
    restart: unless-stopped
    profiles: ["milvus"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - qzda_milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      qzda_net:
        aliases: ["minio"]

  milvus:
    image: milvusdb/milvus:v2.4.22
    container_name: qzda-milvus
    restart: unless-stopped
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - qzda_milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    networks:
      - qzda_net

  # External OPA (Rego). Set DE_OPA_URL=http://127.0.0.1:8181 on control-plane processes.
  opa:
    image: openpolicyagent/opa:0.70.0
    container_name: qzda-opa
    restart: unless-stopped
    profiles: ["opa"]
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies:ro
    networks:
      - qzda_net

  # OpenSearch audit search (dev, security disabled). DE_OPENSEARCH_URL=http://127.0.0.1:9200
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: qzda-opensearch
    restart: unless-stopped
    profiles: ["search"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - qzda_opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - qzda_net

  # Authentik OIDC IdP (heavier than Dex). UI :9000 — see deploy/authentik/README.md
  authentik-postgres:
    image: postgres:16-alpine
    container_name: qzda-authentik-postgres
    restart: unless-stopped
    profiles: ["authentik"]
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    volumes:
      - qzda_authentik_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - qzda_net

  authentik-redis:
    image: redis:7-alpine
    container_name: qzda-authentik-redis
    restart: unless-stopped
    profiles: ["authentik"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - qzda_net

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10.4
    container_name: qzda-authentik
    restart: unless-stopped
    profiles: ["authentik"]
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-changeme-qzda-authentik-dev-secret-key-32b}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-authentik}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@acme.com}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - qzda_authentik_media:/media
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - qzda_net

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10.4
    container_name: qzda-authentik-worker
    restart: unless-stopped
    profiles: ["authentik"]
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-changeme-qzda-authentik-dev-secret-key-32b}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - qzda_authentik_media:/media
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - qzda_net

  # Observability: Prometheus + Grafana (scrapes coarse :8100-8103/metrics)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: qzda-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - qzda_prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qzda_net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: qzda-grafana
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - qzda_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - qzda_net

  # —— Monolith control plane (方案 A) ——
  # Profile: monolith — qzda-app:8100 + qzda-skill-runtime:8093 (+ gateway)
  qzda-app:
    build:
      context: ..
      dockerfile: services/qzda-sys/Dockerfile
      args: { CMD: qzda-app }
    image: qzda-app:local
    container_name: qzda-app
    restart: unless-stopped
    profiles: ["monolith"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qzda-skill-runtime:
        condition: service_healthy
    environment:
      DE_APP_ADDR: ":8100"
      DE_SERVICE: app
      DE_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      DE_REDIS_URL: redis://redis:6379/0
      DE_RUNTIME_MODE: local
      DE_SKILL_RUNTIME_URL: http://qzda-skill-runtime:8093
      DE_SKILL_RUN_SECRET: ${DE_SKILL_RUN_SECRET:-qzda-skill-run-dev}
      DE_WORKFLOW_URL: ${DE_WORKFLOW_URL:-}
      DE_BAN_MOCK_TOKEN: ${DE_BAN_MOCK_TOKEN:-0}
      DE_BAN_DEMO_TOKEN: ${DE_BAN_DEMO_TOKEN:-${DE_BAN_MOCK_TOKEN:-0}}
      DE_ENV: ${DE_ENV:-development}
      DE_JWT_SECRET: ${DE_JWT_SECRET:-}
      DE_PUBLIC_BASE_URL: ${DE_PUBLIC_BASE_URL:-http://127.0.0.1:8089}
      DE_LLM_BASE_URL: ${DE_LLM_BASE_URL:-}
      DE_LLM_API_KEY: ${DE_LLM_API_KEY:-}
      DE_LLM_MODEL: ${DE_LLM_MODEL:-}
      DE_MODEL_CANDIDATE_TIMEOUT: ${DE_MODEL_CANDIDATE_TIMEOUT:-45}
      DE_COPILOT_STREAM_TIMEOUT: ${DE_COPILOT_STREAM_TIMEOUT:-300}
      DE_MODEL_ALLOW_PRIVATE: ${DE_MODEL_ALLOW_PRIVATE:-0}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net
      - qzda_exec_net

  envoy-monolith:
    image: envoyproxy/envoy:v1.31-latest
    container_name: qzda-envoy-monolith
    restart: unless-stopped
    profiles: ["monolith"]
    depends_on:
      qzda-app:
        condition: service_healthy
    volumes:
      - ./envoy/envoy.monolith.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8089:8089"
      - "9903:9901"
    networks:
      - qzda_net

  # —— Coarse-grained control plane (v4) ——
  # Profile: coarse — qzda-sys:8100 qzda-collab:8101 qzda-cap:8102 qzda-workflow:8103 (+ gateway + FastAPI)
  qzda-sys:
    build:
      context: ..
      dockerfile: services/qzda-sys/Dockerfile
      args: { CMD: qzda-sys }
    image: qzda-sys:local
    container_name: qzda-sys
    restart: unless-stopped
    profiles: ["coarse"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DE_SYS_ADDR: ":8100"
      DE_SERVICE: sys
      DE_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      DE_REDIS_URL: redis://redis:6379/0
      DE_ENV: ${DE_ENV:-development}
      DE_BAN_MOCK_TOKEN: ${DE_BAN_MOCK_TOKEN:-0}
      DE_BAN_DEMO_TOKEN: ${DE_BAN_DEMO_TOKEN:-${DE_BAN_MOCK_TOKEN:-0}}
      DE_OPA_URL: ${DE_OPA_URL:-}
      DE_OPENSEARCH_URL: ${DE_OPENSEARCH_URL:-}
      DE_KAFKA_BROKERS: ${DE_KAFKA_BROKERS:-}
      DE_JWT_SECRET: ${DE_JWT_SECRET:-}
      DE_OIDC_ISSUER: ${DE_OIDC_ISSUER:-}
      DE_OIDC_CLIENT_ID: ${DE_OIDC_CLIENT_ID:-}
      DE_OIDC_CLIENT_SECRET: ${DE_OIDC_CLIENT_SECRET:-}
      DE_OIDC_REDIRECT_URL: ${DE_OIDC_REDIRECT_URL:-http://127.0.0.1:8089/api/auth/oidc/callback}
      # Prefer local evaluate; do not point at retired :8094 in coarse mode
      DE_POLICY_URL: ${DE_POLICY_URL:-}
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

  qzda-collab:
    build:
      context: ..
      dockerfile: services/qzda-collab/Dockerfile
      args: { CMD: qzda-collab }
    image: qzda-collab:local
    container_name: qzda-collab
    restart: unless-stopped
    profiles: ["coarse"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qzda-sys:
        condition: service_healthy
    environment:
      DE_COLLAB_ADDR: ":8101"
      DE_SERVICE: collab
      DE_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      DE_REDIS_URL: redis://redis:6379/0
      DE_AGENT_RUNTIME_URL: http://qzda-agent-runtime:8091
      DE_RAG_URL: http://qzda-rag:8092
      DE_SKILL_RUNTIME_URL: http://qzda-skill-runtime:8093
      DE_CAP_URL: ${DE_CAP_URL:-http://qzda-cap:8102}
      DE_WORKFLOW_URL: ${DE_WORKFLOW_URL:-http://qzda-workflow:8103}
      DE_ENV: ${DE_ENV:-development}
      DE_BAN_MOCK_TOKEN: ${DE_BAN_MOCK_TOKEN:-0}
      DE_BAN_DEMO_TOKEN: ${DE_BAN_DEMO_TOKEN:-${DE_BAN_MOCK_TOKEN:-0}}
      DE_POLICY_URL: ${DE_COLLAB_POLICY_URL:-http://qzda-sys:8100}
      DE_SKILL_RUN_SECRET: ${DE_SKILL_RUN_SECRET:-qzda-skill-run-dev}
      DE_JWT_SECRET: ${DE_JWT_SECRET:-}
      DE_LLM_BASE_URL: ${DE_LLM_BASE_URL:-}
      DE_LLM_API_KEY: ${DE_LLM_API_KEY:-}
      DE_LLM_MODEL: ${DE_LLM_MODEL:-}
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8101/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net
      - qzda_exec_net

  qzda-cap:
    build:
      context: ..
      dockerfile: services/qzda-cap/Dockerfile
      args: { CMD: qzda-cap }
    image: qzda-cap:local
    container_name: qzda-cap
    restart: unless-stopped
    profiles: ["coarse"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qzda-sys:
        condition: service_healthy
    environment:
      DE_CAP_ADDR: ":8102"
      DE_SERVICE: cap
      DE_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      DE_REDIS_URL: redis://redis:6379/0
      DE_RAG_URL: http://qzda-rag:8092
      DE_SKILL_RUNTIME_URL: http://qzda-skill-runtime:8093
      DE_ENV: ${DE_ENV:-development}
      DE_BAN_MOCK_TOKEN: ${DE_BAN_MOCK_TOKEN:-0}
      DE_BAN_DEMO_TOKEN: ${DE_BAN_DEMO_TOKEN:-${DE_BAN_MOCK_TOKEN:-0}}
      DE_VAULT_ADDR: ${DE_VAULT_ADDR:-}
      DE_VAULT_TOKEN: ${DE_VAULT_TOKEN:-}
      DE_SKILL_RUN_SECRET: ${DE_SKILL_RUN_SECRET:-qzda-skill-run-dev}
      DE_POLICY_URL: ${DE_CAP_POLICY_URL:-http://qzda-sys:8100}
      DE_JWT_SECRET: ${DE_JWT_SECRET:-}
      # Local Ollama / private LLM endpoints (set 1 only when intentional)
      DE_MODEL_ALLOW_PRIVATE: ${DE_MODEL_ALLOW_PRIVATE:-0}
      DE_LLM_BASE_URL: ${DE_LLM_BASE_URL:-}
      DE_LLM_API_KEY: ${DE_LLM_API_KEY:-}
      DE_LLM_MODEL: ${DE_LLM_MODEL:-}
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8102/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net
      - qzda_exec_net

  envoy-coarse:
    image: envoyproxy/envoy:v1.31-latest
    container_name: qzda-envoy-coarse
    restart: unless-stopped
    profiles: ["coarse"]
    depends_on:
      qzda-sys:
        condition: service_healthy
      qzda-collab:
        condition: service_healthy
      qzda-cap:
        condition: service_healthy
      qzda-workflow:
        condition: service_healthy
    volumes:
      - ./envoy/envoy.coarse.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8089:8089"
      - "9902:9901"
    networks:
      - qzda_net

  qzda-agent-runtime:
    build:
      context: ../services/qzda-agent-runtime
      dockerfile: Dockerfile
    image: qzda-agent-runtime:local
    container_name: qzda-agent-runtime
    restart: unless-stopped
    profiles: ["coarse"]
    environment:
      DE_BIND_HOST: "0.0.0.0"
      DE_BIND_PORT: "8091"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

  qzda-rag:
    build:
      context: ../services/qzda-rag
      dockerfile: Dockerfile
    image: qzda-rag:local
    container_name: qzda-rag
    restart: unless-stopped
    profiles: ["coarse"]
    environment:
      DE_BIND_HOST: "0.0.0.0"
      DE_BIND_PORT: "8092"
      DE_MILVUS_URI: ${DE_MILVUS_URI:-}
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

  qzda-skill-runtime:
    build:
      context: ..
      dockerfile: services/qzda-skill-runtime/Dockerfile
    image: qzda-skill-runtime:local
    container_name: qzda-skill-runtime
    restart: unless-stopped
    profiles: ["coarse", "monolith"]
    # gVisor 集成：
    # - 默认 runtime=runc（兼容性兜底）
    # - 设 DE_SKILL_RUNTIME=runsc 启用 runsc：host 必须先安装 runsc
    #   （install runsc: curl -fsSL https://gvisor.dev/archive/nightly/latest/runsc \
    #       -o /usr/local/bin/runsc && chmod +x /usr/local/bin/runsc）
    # - gVisor 自己实现 syscall 拦截，必须 seccomp=unconfined
    # - 可选 DE_SKILL_RUNTIME=runsc-kvm 需 host 启用 KVM（Linux host only）
    runtime: ${DE_SKILL_RUNTIME:-runc}
    # Intentionally no DE_DATABASE_URL / DE_REDIS_URL
    environment:
      DE_BIND_HOST: "0.0.0.0"
      DE_BIND_PORT: "8093"
      # 阶段 4 #2:fail-closed — secret 来自 secrets mount(/etc/qzda/skill-run-secret),
      # 不再 fallback 到开发占位 qzda-skill-run-dev。生产必须 mount 文件,否则
      # skill_runtime 主进程 lifespan 主动 skill_secret() 抛 RuntimeError 退出。
      DE_SKILL_RUN_SECRET_FILE: /etc/qzda/skill-run-secret
      DE_SKILL_SANDBOX: ${DE_SKILL_SANDBOX:-runsc}
      DE_SKILL_REQUIRE_ISOLATION: "1"
      DE_SKILL_RUNTIME: ${DE_SKILL_RUNTIME:-runc}
      # 阶段 3:可观测性
      # - PROMETHEUS_MULTIPROC_DIR:prometheus_client 多进程模式必填(uvicorn workers > 1),
      #   tmpfs 8m 放 metric 文件;单 worker 也兼容。
      # - OTEL_EXPORTER_OTLP_ENDPOINT:配置后由 telemetry.py 自动切换 OTLP exporter,
      #   未配则走 Console(开发期友好)。
      # - DE_SKILL_AUDIT:1 = 子进程内自动安装 audit_hooks,记录 Python 层 syscall 计数。
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prom-multiproc"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DE_SKILL_AUDIT: ${DE_SKILL_AUDIT:-1}
      # 阶段 4 #6:rate limit 默认 60 req/min per (ws,actor) + IP。开发 / 测试
      # 环境覆盖:export DE_SKILL_RATE_LIMIT_PER_MIN=10000 即可临时放开。
      DE_SKILL_RATE_LIMIT_PER_MIN: ${DE_SKILL_RATE_LIMIT_PER_MIN:-60}
      # 阶段 4 #3:信任的 signer key IDs(CSV),Python 校验 .signed marker 时用。
      # 留空 = 所有包都被拒(fail-closed)。weather 包对应的 ID 在 tools/sign-skill
      # 跑一次后会落到 DEPLOY_TRUSTED_KEYS_DIR 注入。
      DE_SKILL_TRUSTED_KEY_IDS: ${DE_SKILL_TRUSTED_KEY_IDS:-ed25519:dev-placeholder}
    # 阶段 4 #2:secret 文件 mount。挂到 /etc/qzda/skill-run-secret,只读。
    secrets:
      - skill_run_secret
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /tmp/prom-multiproc:size=8m
      - /var/run:size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
      # GVisor 自行实现 syscall 拦截（seccomp 必须 unconfined，否则 runsc 启动失败）
      - seccomp=unconfined
      - apparmor=unconfined
    # 资源配额（gVisor 启动开销略高，留 1GiB / 2 CPU 兜底）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - qzda_exec_net

  qzda-workflow:
    build:
      context: ..
      dockerfile: services/qzda-workflow/Dockerfile
      args: { CMD: qzda-workflow }
    image: qzda-workflow:local
    container_name: qzda-workflow
    restart: unless-stopped
    # Enable with: --profile coarse | --profile monolith-workflow
    profiles: ["coarse", "monolith-workflow"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DE_WORKFLOW_ADDR: ":8103"
      DE_WORKFLOW_HTTP: "1"
      DE_WORKFLOW_WORKER: ${DE_WORKFLOW_WORKER:-0}
      DE_TEMPORAL_HOST: ${DE_TEMPORAL_HOST:-}
      DE_DATABASE_URL: postgres://de:de@postgres:5432/digital_employee?sslmode=disable
      DE_REDIS_URL: redis://redis:6379/0
      DE_AGENT_RUNTIME_URL: http://qzda-agent-runtime:8091
      DE_RAG_URL: http://qzda-rag:8092
      DE_BAN_MOCK_TOKEN: ${DE_BAN_MOCK_TOKEN:-0}
      DE_BAN_DEMO_TOKEN: ${DE_BAN_DEMO_TOKEN:-${DE_BAN_MOCK_TOKEN:-0}}
      DE_ENV: ${DE_ENV:-development}
      DE_JWT_SECRET: ${DE_JWT_SECRET:-}
      DE_SERVICE: workflow
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8103/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - qzda_net

volumes:
  qzda_pg:
  qzda_redis:
  qzda_milvus_etcd:
  qzda_milvus_minio:
  qzda_milvus_data:
  qzda_opensearch:
  qzda_authentik_pg:
  qzda_authentik_media:
  qzda_prometheus:
  qzda_grafana:

# 阶段 4 #2:RunToken HMAC 密钥。生产部署时应换成 Vault Agent sidecar 写入文件;
# 开发期手动 ``openssl rand -hex 32 > backend/deploy/secrets/skill-run-secret``。
secrets:
  skill_run_secret:
    file: ./secrets/skill-run-secret

networks:
  qzda_net:
    driver: bridge
  # Execution plane only: skill-runtime + collab/cap for invoke.
  qzda_exec_net:
    driver: bridge
    internal: false
