global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qzda-monolith
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: qzda-app }
  # 阶段 3:qzda-sandbox 在 docker 内部以 compose service name 直连,
  # 与 host.docker.internal 类外部入口隔离。隔离网络 qzda_exec_net 上 Prometheus
  # 也可达(由 deploy 网络拓扑保证)。
  - job_name: qzda-sandbox
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['qzda-sandbox:8093']
        labels:
          service: sandbox
          tier: execution-plane
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]