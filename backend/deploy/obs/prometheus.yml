global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qzda-monolith
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: qzda-app }
  - job_name: qzda-coarse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: qzda-sys }
      - targets: ["host.docker.internal:8101"]
        labels: { service: qzda-collab }
      - targets: ["host.docker.internal:8102"]
        labels: { service: qzda-cap }
      - targets: ["host.docker.internal:8103"]
        labels: { service: qzda-workflow }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
