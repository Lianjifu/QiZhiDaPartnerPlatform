# Local OIDC IdP for control plane (compose profile: oidc)
# Issuer: http://127.0.0.1:5556/dex
# Users: admin@acme.com / password, user@acme.com / password, audit@acme.com / password
# Client id "qzda-core" 为历史 OIDC 客户端名，回调指向 qzda-gateway :8089

issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
telemetry:
  http: 0.0.0.0:5558
staticClients:
  - id: qzda-core
    redirectURIs:
      - http://127.0.0.1:8089/api/auth/oidc/callback
    name: qzda-core
    secret: qzda-core-secret
enablePasswordDB: true
staticPasswords:
  - email: admin@acme.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W" # password
    username: admin
    userID: "u1"
  - email: user@acme.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W" # password
    username: user
    userID: "u2"
  - email: audit@acme.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W" # password
    username: audit
    userID: "u3"
oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
connectors: []
