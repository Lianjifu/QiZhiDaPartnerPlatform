# L00 edge with TLS termination + optional upstream (dev CA under deploy/certs).
# Compose profile: mtls — https://127.0.0.1:8443
static_resources:
  listeners:
    - name: listener_https
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - filter_chain_match:
            transport_protocol: tls
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/server.crt }
                    private_key: { filename: /etc/envoy/certs/server.key }
                validation_context:
                  trusted_ca: { filename: /etc/envoy/certs/ca.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: qzda-core }
                    - san_type: DNS
                      matcher: { exact: localhost }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: qzda_mtls_ingress
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/agent" }
                          route:
                            cluster: qzda_core
                            timeout: 180s
                            prefix_rewrite: "/api/copilot"
                        - match: { prefix: "/api" }
                          route: { cluster: qzda_core, timeout: 180s }
                        - match: { prefix: "/connect" }
                          route: { cluster: qzda_core, timeout: 60s }
                        - match: { prefix: "/de." }
                          route: { cluster: qzda_core, timeout: 60s }
                        - match: { prefix: "/healthz" }
                          route: { cluster: qzda_core }
                        - match: { prefix: "/readyz" }
                          route: { cluster: qzda_core }
                        - match: { prefix: "/metrics" }
                          route: { cluster: qzda_core }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: qzda_core
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qzda_core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
