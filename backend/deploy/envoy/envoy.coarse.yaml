# Path-based split for coarse-grained units (v4).
# Compose: make compose-up-coarse → gateway :8089 → qzda-sys:8100 / collab:8101 / cap:8102 / workflow:8103
static_resources:
  listeners:
    - name: listener_http_coarse
      address:
        socket_address: { address: 0.0.0.0, port_value: 8089 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: qzda_coarse_ingress
                codec_type: AUTO
                route_config:
                  name: coarse_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/agent" }
                          route:
                            cluster: qzda_collab
                            timeout: 180s
                            prefix_rewrite: "/api/copilot"
                        - match: { prefix: "/api/copilot" }
                          route: { cluster: qzda_collab, timeout: 180s }
                        - match: { prefix: "/api/conversations" }
                          route: { cluster: qzda_collab, timeout: 180s }
                        - match: { prefix: "/api/sessions" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/share" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/attachments" }
                          route: { cluster: qzda_collab, timeout: 60s }
                        - match: { prefix: "/api/actions" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/tasks" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/digital-employees" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/digital-employee-" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/agents" }
                          route: { cluster: qzda_collab, timeout: 30s }
                        - match: { prefix: "/api/slash-commands" }
                          route: { cluster: qzda_collab, timeout: 15s }

                        - match: { prefix: "/api/workflows" }
                          route: { cluster: qzda_workflow, timeout: 60s }
                        - match: { prefix: "/api/workflow-" }
                          route: { cluster: qzda_workflow, timeout: 60s }

                        # model-invoke before /api/model (prefix match is first-wins; stream needs long timeout)
                        - match: { prefix: "/api/model-invoke" }
                          route: { cluster: qzda_cap, timeout: 120s }
                        - match: { prefix: "/api/model" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/knowledge" }
                          route: { cluster: qzda_cap, timeout: 60s }
                        - match: { prefix: "/api/memory" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/skills" }
                          route: { cluster: qzda_cap, timeout: 60s }
                        - match: { prefix: "/api/skill-" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/mcp-connections" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/tools" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/channel" }
                          route: { cluster: qzda_cap, timeout: 30s }
                        - match: { prefix: "/api/channels" }
                          route: { cluster: qzda_cap, timeout: 30s }

                        - match: { prefix: "/v1/evaluate" }
                          route: { cluster: qzda_sys, timeout: 15s }
                        - match: { prefix: "/api/access" }
                          route: { cluster: qzda_sys, timeout: 15s }
                        - match: { prefix: "/api/zero-trust" }
                          route: { cluster: qzda_sys, timeout: 15s }
                        - match: { prefix: "/api/governance" }
                          route: { cluster: qzda_sys, timeout: 15s }
                        - match: { prefix: "/api/audit" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/workspaces" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/auth" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/home" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/operations" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/billing" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/backups" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/tenant" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/notification-channels" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/api/api-keys" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/de.collab." }
                          route: { cluster: qzda_collab, timeout: 60s }
                        - match: { prefix: "/de.employee." }
                          route: { cluster: qzda_collab, timeout: 60s }
                        - match: { prefix: "/de.rag." }
                          route: { cluster: qzda_cap, timeout: 60s }
                        - match: { prefix: "/de.runtime." }
                          route: { cluster: qzda_cap, timeout: 60s }
                        - match: { prefix: "/connect" }
                          route: { cluster: qzda_sys, timeout: 60s }
                        - match: { prefix: "/de." }
                          route: { cluster: qzda_sys, timeout: 60s }
                        - match: { prefix: "/api" }
                          route: { cluster: qzda_sys, timeout: 30s }
                        - match: { prefix: "/healthz" }
                          route: { cluster: qzda_sys }
                        - match: { prefix: "/readyz" }
                          route: { cluster: qzda_sys }
                        - match: { prefix: "/metrics" }
                          route: { cluster: qzda_sys }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: qzda_sys
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qzda_sys
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qzda-sys, port_value: 8100 }
    - name: qzda_collab
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qzda_collab
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qzda-collab, port_value: 8101 }
    - name: qzda_cap
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qzda_cap
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qzda-cap, port_value: 8102 }
    - name: qzda_workflow
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qzda_workflow
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qzda-workflow, port_value: 8103 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
